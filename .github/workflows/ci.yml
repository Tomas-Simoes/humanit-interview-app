name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      APP_SECURITY_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check
        run: make format-check

      - name: Verify and coverage
        run: make verify

      - name: Dependency security check
        working-directory: api
        run: >
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=9
          -DskipProvidedScope=true
          -DskipTestScope=true
          -Dformat=HTML

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: api/target/dependency-check-report.html
          if-no-files-found: ignore
