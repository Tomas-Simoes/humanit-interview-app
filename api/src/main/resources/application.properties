spring.application.name=humanit-interview-api
server.port=8080
debug=false

spring.datasource.url=jdbc:h2:mem:humanit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

logging.level.humanit=INFO
logging.pattern.level=%5p [requestId:%X{requestId}]
logging.file.name=${LOGGING_FILE_NAME:logs/humanit-api.log}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.security.jwt.issuer=humanit-interview-api
app.security.jwt.audience=humanit-client-api
app.security.jwt.expiration-seconds=900
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
